<!DOCTYPE html>
<html>
  <head>
    <title>Meu FPS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./styles/main.css" />
    <script type="importmap">
      { "imports": { "three": "../../build/three.module.js" } }
    </script>
  </head>
  <body>
    <div id="blocker">
      <div id="instructions">
        <h1>Instruções</h1>
        <p>Move: WASD/setas</p>
        <p>Look: Mouse</p>
        <p>Shoot: Left Mouse Button</p>
        <p>Jump: Space</p>
        <p>Change Weapons: 1/2 or Mouse Wheel</p>
        <p>Desligar/ligar música: Q</p>
        <p>Modo Godlike: G</p>
        <p>Pegar todas as chaves: C</p>
        <p>Clique para jogar</p>
      </div>    
    </div>

    <div id="death-screen" style="display: none;">
        <div class="death-message">Você morreu!</div>
        <button id="restart-button">Reiniciar</button>
    </div>

  <div id="health-bar-container">
      <div id="health-bar-fill"></div>
      <span id="health-bar-text">200 / 200</span>
  </div>

    <div id="temporary-messages-container"></div>    
    <div id="webgl-output"></div>
    <div id="mira"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
